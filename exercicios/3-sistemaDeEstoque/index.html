<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque da BRANDAO LABS ( Loja de periféricos )</title>
</head>
<body>
    <style>
        h1 {
            text-align: center;
        }
    </style>

    <h1>BRANDAO LABS</h1>

    <script>
        var produtos = ["Notebook", "Mouse", "Teclado", "Monitor", "Headset"];

        var precos = [3500, 80, 150, 1200, 250];

        console.log(produtos[3]);
        console.log(precos[2]);

        precos[1] = 100;
        precos[4] = 300;

        console.log(produtos);
        console.log(precos);

        // Desafio extra!!

        console.log(produtos[0] + ' => ' + precos[0]);
        console.log(produtos[1] + ' => ' + precos[1]);
        console.log(produtos[2] + ' => ' + precos[2]);
        console.log(produtos[3] + ' => ' + precos[3]);
        console.log(produtos[4] + ' => ' + precos[4]);

    </script>
</body>
</html>
