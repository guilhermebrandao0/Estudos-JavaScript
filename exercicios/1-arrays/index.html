<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>1 - Arrays</title>
</head>
<body>
    <style>
        h1 {
            text-align: center;
        }
    </style>
    <h1>Exercícios de arrays em JavaScript</h1>
    <script>
        var numeros = [10, 20, 30, 40, 50];

        console.log(numeros[0]);
        console.log(numeros[2]);
        console.log(numeros[4]);

        numeros[1] = 25;

        console.log(numeros);
    </script>
